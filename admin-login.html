<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DisasterReady - Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h2>DisasterReady</h2>
      <p class="subtitle">Admin Panel</p>
      <h3>Admin Login</h3>

      <form>
        <div class="form-group">
          <label>Username</label>
          <input type="text" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter password">
        </div>
        <a href="admin-dashboard.html" class="btn">Login</a>
      </form>

      <p class="login-note">This is a static front-end demo login for the WT project. No real authentication is performed.</p>
      <a href="#" class="back-link" style="font-size:13px; color:#999;">Forgot Password?</a>
      <a href="index.html" class="back-link">&larr; Back to Website</a>
    </div>
  </div>
</body>
</html>
